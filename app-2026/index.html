<html>
<script type="module">
  import * as counter from "./counter.js";
  import { Car } from "./car.js";

  window.add = () => {
    counter.show(counter.increment());
  };

  window.subtract = () => {
    counter.show(counter.decrement());
  };

  window.playWithJson = () => {
    const v = new Car();

    console.log(v);

    const text = JSON.stringify(v);

    console.log(text);

    const v2 = JSON.parse(text);

    console.log(v2);
  }

  const buttons = document.getElementsByTagName("button");
  for (const button of buttons) {
    button.addEventListener("click", e => console.log(this.id));
  }

  document.addEventListener("DOMContentLoaded", () => {
    const duckDuckGo = document.getElementById("search");

    duckDuckGo.addEventListener("click", e => {
      if (!confirm("Are you sure?")) {
        e.preventDefault();
      }
    });
  })
</script>

<style>
  .reveal {
    max-width: 500px;
    --standard-spacing: 10px;
  }

  .reveal form {
    display: grid;
    grid-template-columns: minmax(250px, auto) 1fr;
    gap: var(--standard-spacing);
  }

  .reveal form *:nth-child(odd) {
    justify-self: end;
  }

  .reveal form input {
    align-self: center;
  }
</style>

<body>
  <button onclick="add()">+</button>
  <button onclick="subtract()">-</button>
  <button onclick="playWithJson()">JSON</button>
  <a href="https://duckduckgo.com" id="search">DuckDuckGo</a>

  <div class="reveal">
    <form>
      <label>First name</label>
      <input list="firstNames">
      <label>Last name</label>
      <input>
      <label>Salary</label>
      <input type="number">
      <label>Birth date</label>
      <input type="date">
      <label>Manager</label>
      <select>
        <option value="Joe">Joe</option>
        <option value="Jane">Jane</option>
        <option value="John">John</option>
        <option value="Jessica">Jessica</option>
      </select>
      <label>Status</label>
      <div>
        <input type="radio" name="status" value="1" checked> <label>Active</label>
        <input type="radio" name="status" value="2"> <label>Retired</label>
      </div>
      <label>Pensum (%)</label>
      <div>
        <input type="range" id="pensum" min="20" max="100" step="20" value="80">
        <output id="pensumOutput" for="pensum">80</output>
        <script>
          const pensum = document.getElementById("pensum");
          const pensumOutput = document.getElementById("pensumOutput");

          pensum.addEventListener("input", () => pensumOutput.value = pensum.value);
        </script>
      </div>
    </form>
  </div>
</body>

</html>
