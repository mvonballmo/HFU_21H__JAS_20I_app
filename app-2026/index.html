<html>
<script type="module">
  import * as counter from "./counter.js";
  import { Car } from "./car.js";

  window.add = () => {
    counter.show(counter.increment());
  };

  window.subtract = () => {
    counter.show(counter.decrement());
  };

  window.playWithJson = () => {
    const v = new Car();

    console.log(v);

    const text = JSON.stringify(v);

    console.log(text);

    const v2 = JSON.parse(text);

    console.log(v2);
  }

  const buttons = document.getElementsByTagName("button");
  for (const button of buttons) {
    button.addEventListener("click", e => console.log(this.id));
  }

  document.addEventListener("DOMContentLoaded", () => {
    const duckDuckGo = document.getElementById("search");

    duckDuckGo.addEventListener("click", e => {
      if (!confirm("Are you sure?")) {
        e.preventDefault();
      }
    });
  })
</script>

<body>
  <button onclick="add()">+</button>
  <button onclick="subtract()">-</button>
  <button onclick="playWithJson()">JSON</button>
  <a href="https://duckduckgo.com" id="search">DuckDuckGo</a>
  <script>
  </script>
</body>

</html>
