<script>
  class MyElement extends HTMLElement {
    static {
      customElements.define("marco-tag", MyElement);
    }

    static get observedAttributes() {
      return ["a"];
    }

    connectedCallback() {
      this.attachShadow({ mode: 'closed' }).innerHTML = "<h1>Marco</h1>";
    }

    attributeChangedCallback(name, oldValue, newValue) {
      // Wird nur für Attribut "a" ausgeführt
    }
  }
</script>

<style>
  .reveal {
    max-width: 500px;
    --standard-spacing: 10px;
  }

  .reveal form {
    display: grid;
    grid-template-columns: minmax(250px, auto) 1fr;
    gap: var(--standard-spacing);
  }

  .reveal form *:nth-child(odd) {
    justify-self: end;
  }

  .reveal form input {
    align-self: center;
  }
</style>

<body>
  <div class="reveal">
    <marco-tag></marco-tag>
    <form>
      <label>First name</label>
      <input list="firstNames">
      <label>Last name</label>
      <input>
      <label>Salary</label>
      <input type="number">
      <label>Birth date</label>
      <input type="date">
      <label>Manager</label>
      <select>
        <option value="Joe">Joe</option>
        <option value="Jane">Jane</option>
        <option value="John">John</option>
        <option value="Jessica">Jessica</option>
      </select>
      <label>Status</label>
      <div>
        <input type="radio" name="status" value="1" checked> <label>Active</label>
        <input type="radio" name="status" value="2"> <label>Retired</label>
      </div>
      <label>Pensum (%)</label>
      <div>
        <input type="range" id="pensum" min="20" max="100" step="20" value="80">
        <output id="pensumOutput" for="pensum">80</output>
        <script>
          const pensum = document.getElementById("pensum");
          const pensumOutput = document.getElementById("pensumOutput");

          pensum.addEventListener("input", () => pensumOutput.value = pensum.value);
        </script>
      </div>
    </form>
  </div>
</body>

</html>
